name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python3 -m pytest tests/ -q
